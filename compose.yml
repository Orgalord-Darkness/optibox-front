name: optibox-dev-frontend

services:
  angular-app:
    build: .
    container_name: angular-dev-app
    ports:
      - "${ANGULAR_PORT}:4200"
    volumes:
      - /var/www/OPtiBox_dev/optibox-front/certs:/certs:ro
    networks:
      - optibox-dev-shared-network

networks:
  optibox-dev-shared-network:
    external: true
